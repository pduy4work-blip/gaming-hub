<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khám phá Cộng đồng Game - GameHub Community</title>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="site-header" id="site-header"></header>

  <main class="main-wrapper">
    <div style="margin-bottom: 2rem;">
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem;">
        <div>
          <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.25rem;">Khám phá Cộng đồng Game</h1>
          <p style="color: var(--text-secondary); font-size: 0.95rem;">Tìm kiếm và tham gia thảo luận các tựa game bạn yêu thích.</p>
        </div>

        <div style="width: 100%; max-width: 320px;">
          <div class="search-input-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="games-search-input" class="search-input" placeholder="Tìm theo tên game..." autocomplete="off">
          </div>
        </div>
      </div>

      <!-- Games Grid -->
      <div class="games-grid" id="games-grid-container">
        <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
          <div class="loading-spinner"></div>
          <p style="margin-top: 0.75rem; color: var(--text-muted);">Đang tải danh sách game...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/games.js"></script>
</body>
</html>
