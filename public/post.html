<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết bài viết - GameHub Community</title>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="main-wrapper">
    <div class="layout-single-col">
      <div id="post-loading" style="text-align: center; padding: 4rem;">
        <div class="loading-spinner"></div>
        <p style="margin-top: 1rem; color: var(--text-muted);">Đang tải nội dung bài viết...</p>
      </div>

      <div id="post-container" style="display: none;">
        <!-- Post Content Card -->
        <article class="post-detail-container">
          <div class="post-header-area">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
              <div id="post-game-tag"></div>
              <div id="post-author-actions" style="display: flex; gap: 0.5rem;"></div>
            </div>

            <h1 class="post-title-main" id="post-title"></h1>

            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-top: 1rem;">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <a id="post-author-avatar-link" href="#">
                  <img id="post-author-avatar" src="" class="avatar" alt="">
                </a>
                <div>
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <a id="post-author-name" href="#" style="font-weight: 700; color: var(--text-primary); text-decoration: none;"></a>
                    <span id="post-author-role"></span>
                  </div>
                  <div style="font-size: 0.82rem; color: var(--text-muted);">
                    Đăng ngày <span id="post-date"></span> • <span id="post-views"></span> lượt xem
                  </div>
                </div>
              </div>

              <!-- Actions group -->
              <div class="post-actions-group">
                <button id="post-like-btn" class="btn btn-outline btn-sm">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  <span id="post-likes-count">0</span> Thích
                </button>
                <button id="post-bookmark-btn" class="btn btn-outline btn-sm" title="Lưu bài viết">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                  Lưu
                </button>
                <button id="post-share-btn" class="btn btn-outline btn-sm" title="Chia sẻ">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                  Chia sẻ
                </button>
                <button id="post-report-btn" class="btn btn-ghost btn-sm" title="Báo cáo vi phạm" style="color: var(--text-muted);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Body Content -->
          <div class="post-body" id="post-body-content"></div>
        </article>

        <!-- Comments Section -->
        <section class="comments-container" id="comments">
          <h2 class="comments-header">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Bình luận (<span id="comments-count">0</span>)
          </h2>

          <!-- Add Comment Form -->
          <div class="comment-form-card" id="add-comment-card">
            <textarea id="comment-input" class="comment-textarea" placeholder="Viết bình luận hoặc chia sẻ góc nhìn của bạn..."></textarea>
            <div class="comment-form-footer">
              <span style="font-size: 0.8rem; color: var(--text-muted);">Tôn trọng lẫn nhau và tuân thủ quy tắc ứng xử.</span>
              <button id="submit-comment-btn" class="btn btn-primary btn-sm">Gửi bình luận</button>
            </div>
          </div>

          <!-- Comments Tree -->
          <div class="comments-list" id="comments-list-container">
            <div style="text-align: center; padding: 2rem; color: var(--text-muted);">Đang tải bình luận...</div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Report Modal -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Báo cáo nội dung vi phạm</h3>
        <button class="btn-icon" id="close-report-modal">&times;</button>
      </div>
      <form id="report-form">
        <input type="hidden" id="report-target-type" value="post">
        <input type="hidden" id="report-target-id" value="">
        
        <div class="form-group">
          <label class="form-label">Lý do báo cáo:</label>
          <select id="report-reason" class="form-control" required>
            <option value="">-- Chọn lý do --</option>
            <option value="Spam / Quảng cáo trái phép">Spam / Quảng cáo trái phép</option>
            <option value="Ngôn từ thù địch, xúc phạm">Ngôn từ thù địch, xúc phạm</option>
            <option value="Chia sẻ hack / cheat / lừa đảo">Chia sẻ hack / cheat / lừa đảo</option>
            <option value="Nội dung đồi trụy hoặc bạo lực">Nội dung đồi trụy hoặc bạo lực</option>
            <option value="Khác">Lý do khác</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Mô tả chi tiết (tùy chọn):</label>
          <textarea id="report-description" class="form-control" rows="3" placeholder="Cung cấp thêm ngữ cảnh cho kiểm duyệt viên..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-report-btn">Hủy</button>
          <button type="submit" class="btn btn-danger">Gửi báo cáo</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/comments.js"></script>
</body>
</html>
