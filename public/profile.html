<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ người dùng - GameHub Community</title>
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="main-wrapper">
    <div class="layout-single-col">
      <!-- Profile Header Card -->
      <div class="card" id="profile-card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1.25rem;">
          <div style="display: flex; align-items: center; gap: 1.25rem;">
            <img id="profile-avatar" src="" alt="" class="avatar avatar-lg">
            <div>
              <div style="display: flex; align-items: center; gap: 0.65rem;">
                <h1 id="profile-display-name" style="font-size: 1.45rem; font-weight: 800; color: var(--text-primary);"></h1>
                <span id="profile-role-badge"></span>
              </div>
              <div id="profile-username" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.4rem;"></div>
              <div id="profile-bio" style="font-size: 0.95rem; color: var(--text-secondary); max-width: 500px; line-height: 1.4;"></div>
              <div id="profile-joined" style="font-size: 0.82rem; color: var(--text-muted); margin-top: 0.5rem;"></div>
            </div>
          </div>

          <div id="profile-action-area"></div>
        </div>

        <!-- User Stats Bar -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center;">
          <div>
            <div id="stat-posts" style="font-size: 1.3rem; font-weight: 700; color: var(--text-primary);">0</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Bài viết</div>
          </div>
          <div>
            <div id="stat-likes" style="font-size: 1.3rem; font-weight: 700; color: var(--color-danger);">0</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Lượt thích nhận được</div>
          </div>
          <div>
            <div id="stat-games" style="font-size: 1.3rem; font-weight: 700; color: var(--color-primary);">0</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Game theo dõi</div>
          </div>
        </div>
      </div>

      <!-- Profile Tabs -->
      <div class="feed-header" style="margin-bottom: 1rem;">
        <div class="feed-tabs">
          <button class="feed-tab active" data-tab="posts">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Bài viết đã đăng
          </button>
          <button class="feed-tab" id="tab-bookmarks-btn" data-tab="bookmarks" style="display: none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            Đã lưu (Bookmarks)
          </button>
          <button class="feed-tab" data-tab="games">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 2 18 2 18 6 6 6 6 2"/><rect x="3" y="6" width="18" height="16" rx="2"/></svg>
            Game theo dõi
          </button>
        </div>
      </div>

      <!-- Tab Content Area -->
      <div id="profile-tab-content">
        <div style="text-align: center; padding: 2rem;">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-profile-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Cập nhật hồ sơ cá nhân</h3>
        <button class="btn-icon" id="close-profile-modal">&times;</button>
      </div>
      <form id="edit-profile-form">
        <div class="form-group">
          <label class="form-label">Tên hiển thị *</label>
          <input type="text" id="edit-display-name" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label">Tiểu sử (Bio)</label>
          <textarea id="edit-bio" class="form-control" rows="3" placeholder="Giới thiệu bản thân, tựa game yêu thích..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Ảnh đại diện (URL hoặc tải lên)</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="edit-avatar-url" class="form-control" placeholder="https://... URL ảnh">
            <label class="btn btn-secondary btn-sm" style="cursor: pointer; white-space: nowrap; margin-bottom: 0;">
              Tải ảnh
              <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
            </label>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-profile-btn">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
